<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1350px;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #12172b 0%, #1f2b4d 55%, #0d1424 100%);
    color: #f5f6fa;
    overflow: hidden;
  }
  .frame {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 110px 90px;
    position: relative;
  }
  .page-index {
    position: absolute;
    top: 64px;
    right: 90px;
    font-size: 28px;
    letter-spacing: 2px;
    color: #8fa3d9;
    font-weight: 600;
  }
  .accent-bar {
    width: 88px;
    height: 8px;
    border-radius: 4px;
    background: #6d8dff;
    margin-bottom: 48px;
  }
  .text {
    font-size: 58px;
    line-height: 1.55;
    font-weight: 700;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .footer {
    position: absolute;
    bottom: 64px;
    left: 90px;
    font-size: 26px;
    color: #7787ad;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="page-index">{{INDEX}} / {{TOTAL}}</div>
    <div class="accent-bar"></div>
    <div class="text">{{TEXT}}</div>
    <div class="footer">{{FOOTER}}</div>
  </div>
</body>
</html>
