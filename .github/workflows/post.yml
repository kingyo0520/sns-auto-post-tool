name: SNS Auto Post

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 07:00(朝の投稿枠、土日含む毎日)
    - cron: "0 22 * * *"
    # 平日 08:00 UTC = 日本時間 17:00(夕方の投稿枠、月〜金のみ)
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_SETTINGS_DATABASE_ID: ${{ secrets.NOTION_SETTINGS_DATABASE_ID }}
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PUBLIC_IMAGE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate images / notify manual posts
        run: npm run generate

      - name: Publish generated images to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/images
          destination_dir: images
          keep_files: true

      - name: Wait for GitHub Pages propagation
        run: sleep 30

      - name: Publish to Instagram
        run: npm run publish
